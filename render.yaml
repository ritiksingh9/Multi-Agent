services:
  - type: web
    name: multi-agent-travel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: multi-agent-travel-db
          property: connectionString

databases:
  - name: multi-agent-travel-db
    plan: free